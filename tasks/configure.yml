---

- name: "Consul | Create /etc/consul.d/"
  ansible.builtin.file:
    path: "{{ consul_config_dir }}"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0755"    
    state: directory

- name: "Consul | Configure /etc/consul.d/consul.hcl"
  ansible.builtin.template:
    src: "consul.hcl.j2"
    dest: "{{ consul_config_dir }}/consul.hcl"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"
  notify:
    - Restart consul

